<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Fraud Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 30px;
        }
        .card-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h3 class="text-center mb-4 fw-bold text-primary">Fraud Detection System</h3>
        
        <form action="/predict" method="post">
            <div class="mb-3">
                <label for="feature1" class="form-label">Time / Feature 1</label>
                <input type="number" step="any" class="form-control" id="feature1" name="time" placeholder="Enter Time" required>
            </div>
            
            <div class="mb-3">
                <label for="feature2" class="form-label">Amount / Feature 2</label>
                <input type="number" step="any" class="form-control" id="feature2" name="amount" placeholder="Enter Amount" required>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg">Predict Transaction</button>
            </div>
        </form>

        {% if result %}
            <div class="alert {% if 'Safe' in result %}alert-success{% else %}alert-danger{% endif %} text-center mt-4 mb-0 fw-semibold" role="alert">
                {{ result }}
            </div>
        {% endif %}

        <div class="mt-4 pt-3 border-top">
            <h5 class="text-center mb-3">Analytics Dashboard</h5>
            <canvas id="fraudChart" width="400" height="200"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const safeCount = {{ safe_count | default(0) }};
        const fraudCount = {{ fraud_count | default(0) }};

        const ctx = document.getElementById('fraudChart').getContext('2d');
        const fraudChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Safe Transactions', 'Fraud Transactions'],
                datasets: [{
                    data: [safeCount, fraudCount],
                    backgroundColor: ['#198754', '#dc3545'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                    }
                }
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
